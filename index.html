<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0",viewport-fit=cover">
    <title>MI POMODORO</title>
    <!-- ICONO DE APP -->
     <link rel="icon" href="icono_tomate.png">
    <link rel="apple-touch-icon" href="icono_tomate.png">
    
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gluten:wght@700&family=Matemasie&display=swap" rel="stylesheet">    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class = "pantalla-inicio">
        <img src="fotos/inicio/i1.png" class="i1-imagen" alt="i1">
        <h1> ¿CUÁNTO TIEMPO VAS A CONCENTRARTE?</h1>
        <div class = "botones-tiempo"> 
            <button class = "btn-25">25:00</button>
            <button class = "btn-45">45:00</button>
            <button class = "btn-50">50:00</button>
        </div>
        <div class = "tiempo-elegido">
            <input class="mi-input" type="number" placeholder="OTRO" step="5" min="5" max="120">
            <button class = "btn-otro">PLAY</button>

        </div>


    </div>


    <div class="pomodoro-app oculto">
     <!--   <img src="fotos/tomate/t1.png" class="tomate-imagen" alt="tomate"> -->

    
        <div class = "mensaje-texto">TU PUEDES, MÁS SE PERDIÓ EN LA GUERRA</div>
        <div class = "timer-display"></div>
        <div class = "botones-container">
            <button class="btn-play">▶︎</button>
            <button class="btn-pausa">❚❚</button>
            <button class="btn-meRindo">⏹︎</button>
        </div>
        <div class = "atras">
            <button class="btn-atras">↩︎</button>
        </div>

        <div class = "musica">
            <button class="btn-musica">♫</button>
        </div>
        

        <!-- <div class = "contador-progreso">X X X</div>*/ -->
    
    </div>

</body>
<script src="script.js"></script>
</html>
